# ===============================================================
# Reusable AWS Deploy Workflow
# ===============================================================
#
# Builds the server image from this fork and rolls it out to ECS.
#
#   1. Build packages/server/Dockerfile (build context = repo root,
#      because the npm workspaces lockfile lives there).
#   2. Push to the account's ECR repo as :latest and :<sha>.
#   3. Force a new deployment on every ECS service the
#      fe-ibmi-mcp-server CDK stack created, then wait for stability.
#
# Called by deploy-development.yml and deploy-production.yml, which
# supply only the environment. Keeping the body here means the dev and
# prod paths cannot drift apart.
#
# The IAM role comes from the AWS_DEPLOY_ROLE secret on the dev and prod
# GitHub environments rather than from an input. Setting `environment` on
# the job below is what selects which of the two applies.
#
# The callers must grant `id-token: write` and pass `secrets: inherit` on the
# job that calls this workflow.
#
# ===============================================================

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment gating the deploy (dev or prod).
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ibmi-mcp-server
  # CloudFormation appends a random suffix to each service name, and the stack
  # creates one service per local zone, so the rollout matches on this prefix
  # rather than hardcoding names that change on stack replacement.
  SERVICE_PREFIX: fe-ibmi-mcp-server-

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=deploy-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=deploy-${{ inputs.environment }}
          provenance: false

      - name: Roll out to ECS
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          targets=()
          for cluster in $(aws ecs list-clusters --query 'clusterArns[]' --output text); do
            # The role can only list services in the clusters this stack deploys
            # into, so skip anything else in the account instead of failing.
            services=$(aws ecs list-services --cluster "$cluster" \
                         --query 'serviceArns[]' --output text 2>/dev/null || true)
            for service_arn in $services; do
              service="${service_arn##*/}"
              [[ "$service" == "$SERVICE_PREFIX"* ]] || continue
              targets+=("${cluster}|${service}")
            done
          done

          # No service yet is the expected state the first time this runs: the
          # CDK stack cannot create a service until the ECR repo holds an image.
          # Exit clean so this run can seed the repo, then enable the service in
          # the CDK and re-run.
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::notice::No ECS service matching '${SERVICE_PREFIX}' found. Image is pushed to ECR; set CREATE_SERVICES=true in the CDK stack and deploy to start serving it."
            exit 0
          fi

          for target in "${targets[@]}"; do
            echo "Forcing new deployment: ${target##*|}"
            aws ecs update-service \
              --cluster "${target%%|*}" \
              --service "${target##*|}" \
              --force-new-deployment >/dev/null
          done

          # Wait only after every rollout has been kicked off, so the services
          # converge in parallel instead of one after another.
          for target in "${targets[@]}"; do
            echo "Waiting for ${target##*|} to stabilize..."
            aws ecs wait services-stable \
              --cluster "${target%%|*}" \
              --services "${target##*|}"
          done

          echo "${#targets[@]} service(s) stable on ${IMAGE_TAG}."
